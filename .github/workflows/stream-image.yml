name: Stream Random Image

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title (for logging only)'
        required: false
        default: 'Ambient Stream'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000          # 5 hours base
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 720
      HEIGHT: 1280
      # Hardcoded YouTube stream key – change this to your own
      STREAM_KEY: zhz6-63as-rd13-wd4b-8kvy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Calculate random duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds"

      - name: Pick random image
        id: image
        run: |
          mkdir -p images
          IMAGE=$(find images/ -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | shuf -n 1)
          if [ -z "$IMAGE" ]; then
            echo "No image found, generating a fallback gradient"
            ffmpeg -y -f lavfi -i "color=c=0x1a1a2e:s=${WIDTH}x${HEIGHT}:d=1" -frames:v 1 fallback.jpg
            IMAGE="fallback.jpg"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE"

      - name: Pick random song
        id: audio
        run: |
          mkdir -p songs
          SONG=$(find songs/ -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) | shuf -n 1)
          if [ -z "$SONG" ]; then
            echo "No song found, generating silent loop"
            ffmpeg -y -f lavfi -i "anullsrc=r=44100:cl=stereo" -t 10 silent.wav
            SONG="silent.wav"
          fi
          echo "song=$SONG" >> $GITHUB_OUTPUT
          echo "Using audio: $SONG"

      - name: Stream to YouTube
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          IMAGE="${{ steps.image.outputs.image }}"
          SONG="${{ steps.audio.outputs.song }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"

          # Apply a gentle Ken Burns zoom + slight colour shift, then loop the image
          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i "$IMAGE" \
            -stream_loop -1 -i "$SONG" \
            -filter_complex "[0:v]scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},zoompan=z='min(zoom+0.0015,1.04)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=${WIDTH}x${HEIGHT}:fps=30,eq=brightness=0.98:contrast=1.03:hue=h=t*4,format=yuv420p[v];[1:a]aformat=channel_layouts=stereo,volume=0.9[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k \
            -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -t $TOTAL \
            -f flv "$STREAM_URL"
