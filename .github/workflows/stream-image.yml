name: Stream Random Image

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title (for logging only)'
        required: false
        default: 'Ambient Stream'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 720
      HEIGHT: 1280
      STREAM_KEY: "sjam-ar42-hmuk-jmg6-25ew"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup FFmpeg
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Debug repo structure
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Repo tree ==="
          find . -maxdepth 3 -type d -print
          echo "=== images/ ==="
          ls -lah images || echo "no images dir"
          echo "=== songs/ ==="
          ls -lah songs || echo "no songs dir"

      - name: Calculate random duration
        id: timing
        run: |
          set -euo pipefail
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "START_OFFSET=$START_OFFSET, END_OFFSET=$END_OFFSET"
          echo "TOTAL seconds: $TOTAL (~$((TOTAL/3600))h $(((TOTAL%3600)/60))m)"

      - name: Pick random image
        id: image
        run: |
          set -euo pipefail
          mkdir -p images
          mapfile -t CANDIDATES < <(find images -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | sort)
          echo "Found ${#CANDIDATES[@]} candidate images"
          printf ' - %s\n' "${CANDIDATES[@]}" || true

          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            echo "::error::No images found in images/. Generating diagnostic fallback."
            ffmpeg -y -f lavfi -i "color=c=red:s=${WIDTH}x${HEIGHT}:d=1" -vf "drawtext=text='NO IMAGE FOUND':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2" -frames:v 1 fallback.jpg
            IMAGE="fallback.jpg"
          else
            RAW=$(printf '%s\n' "${CANDIDATES[@]}" | shuf -n 1)
            echo "Selected raw: $RAW"
            file "$RAW"
            ffmpeg -y -i "$RAW" -frames:v 1 normalized.jpg
            IMAGE="normalized.jpg"
          fi

          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt -of default=nw=1 "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Final image to stream: $IMAGE"

      - name: Pick random song
        id: audio
        run: |
          set -euo pipefail
          mkdir -p songs
          mapfile -t SONGS < <(find songs -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' -o -iname '*.flac' \) | sort)
          echo "Found ${#SONGS[@]} candidate songs"
          printf ' - %s\n' "${SONGS[@]}" || true

          if [ ${#SONGS[@]} -eq 0 ]; then
            echo "::warning::No songs found, generating 10s silence"
            ffmpeg -y -f lavfi -i "anullsrc=r=44100:cl=stereo" -t 10 silent.wav
            SONG="silent.wav"
          else
            SONG=$(printf '%s\n' "${SONGS[@]}" | shuf -n 1)
          fi

          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels,duration -of default=nw=1 "$SONG"
          echo "song=$SONG" >> $GITHUB_OUTPUT
          echo "Final audio to stream: $SONG"

      - name: Stream to YouTube
        run: |
          set -x
          TOTAL="${{ steps.timing.outputs.total }}"
          IMAGE="${{ steps.image.outputs.image }}"
          SONG="${{ steps.audio.outputs.song }}"
          STREAM_URL="rtmp://a.rtmp.youtube.com/live2/${STREAM_KEY}"

          echo "=== STREAM CONFIG ==="
          echo "Title: ${{ inputs.title }}"
          echo "Duration: $TOTAL sec"
          echo "Image: $IMAGE ($(stat -c%s "$IMAGE") bytes)"
          echo "Audio: $SONG ($(stat -c%s "$SONG") bytes)"
          echo "Resolution: ${WIDTH}x${HEIGHT}"

          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i "$IMAGE" \
            -stream_loop -1 -re -i "$SONG" \
            -filter_complex \
              "[0:v]scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},format=yuv420p,zoompan=z='min(zoom+0.0015,1.04)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=${WIDTH}x${HEIGHT}:fps=30[v];[1:a]aformat=channel_layouts=stereo,volume=0.9[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -g 60 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -t "$TOTAL" \
            -f flv "$STREAM_URL"
