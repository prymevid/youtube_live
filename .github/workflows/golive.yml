name: golive

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Q Without U'
      question:
        description: 'Trivia question'
        required: true
        default: 'No English word starts with q without u. Prove me wrong.'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 720
      HEIGHT: 1280

    steps:
      - name: Calculate duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds"

      # ---------- FAST DEPENDENCY INSTALL ----------
      - name: Install FFmpeg + SVG tools (fast)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin
      # ---------------------------------------------

      - name: Get background
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg
          ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=20" bg_blur.jpg

      - name: Create overlay (720x1280)
        run: |
          TITLE="${{ inputs.title }}"
          QUESTION="${{ inputs.question }}"

          # Escape XML
          TITLE_ESC=$(printf '%s' "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
          QUESTION_ESC=$(printf '%s' "$QUESTION" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')

          # Wrap question to 26 chars per line
          WRAPPED=$(echo "$QUESTION_ESC" | fold -s -w 26)
          TSPAN=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            TSPAN="${TSPAN}<tspan x=\"360\" dy=\"1.4em\">${line}</tspan>"
          done <<< "$WRAPPED"

          cat > trivia.svg <<EOF
          <svg width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111827" stop-opacity="0.92"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
              </filter>
            </defs>
            <!-- card -->
            <rect x="40" y="340" width="640" height="600" rx="40" fill="url(#g)" stroke="#ffffff22" stroke-width="2" filter="url(#shadow)"/>
            <!-- TRIVIA -->
            <text x="360" y="440" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="#fbbf24" text-anchor="middle">TRIVIA</text>
            <!-- title -->
            <text x="360" y="505" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#9ca3af" text-anchor="middle">${TITLE_ESC}</text>
            <!-- question - starts at y=580, then tspans add lines -->
            <text x="360" y="580" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">${TSPAN}</text>
          </svg>
          EOF

          # Convert to PNG for perfect FFmpeg compatibility
          rsvg-convert -w 720 -h 1280 trivia.svg -o trivia.png

      - name: Make audio loop
        run: |
          ffmpeg -y -f lavfi -i "sine=f=220:d=300,volume=0.25" -f lavfi -i "anoisesrc=d=300:c=pink:r=44100:a=0.015" -filter_complex amix=inputs=2:duration=longest -t 300 audio_loop.wav

      - name: Stream to YouTube
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -loop 1 -framerate 30 -i trivia.png \
            -stream_loop -1 -i audio_loop.wav \
            -filter_complex "[0:v]hue=h=t*6,eq=brightness=0.98:contrast=1.05,format=yuv420p[bg];[1:v]format=rgba[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:format=auto[v];[2:a]aformat=channel_layouts=stereo,volume=0.8[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -t $TOTAL -f flv "rtmp://a.rtmp.youtube.com/live2/0vky-mmwa-v8t9-j5x0-d6cj"
