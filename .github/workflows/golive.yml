name: golive

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Q Without U'
      question:
        description: 'Trivia question'
        required: true
        default: 'No English word starts with q without u. Prove me wrong.'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # === CHANGEABLE AT TOP ===
      BASE_DURATION_SEC: 18000 # 5 hours
      RANDOM_START_MAX: 600 # +0-10 min at start
      RANDOM_END_MAX: 600 # +0-10 min at end
      WIDTH: 1080
      HEIGHT: 1920 # 9:16

    steps:
      - name: Calculate dynamic duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "start_offset=$START_OFFSET" >> $GITHUB_OUTPUT
          echo "end_offset=$END_OFFSET" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds (~$((TOTAL/3600))h $(((TOTAL%3600)/60))m)"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Get random background and blur
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg
          ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=30" bg_blur.jpg

      - name: Create SVG trivia box
        run: |
          cat > trivia.svg << 'SVGEOF'
          <svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
              </filter>
            </defs>
            <rect x="60" y="520" width="960" height="880" rx="48" fill="url(#g)" filter="url(#shadow)" stroke="#ffffff22" stroke-width="2"/>
            <text x="540" y="640" font-family="Inter, Arial" font-size="52" font-weight="700" fill="#fbbf24" text-anchor="middle">TRIVIA</text>
            <text x="540" y="720" font-family="Inter, Arial" font-size="36" fill="#9ca3af" text-anchor="middle">${{ github.event.inputs.title }}</text>
            <foreignObject x="120" y="800" width="840" height="520">
              <div xmlns="http://www.w3.org/1999/xhtml" style="color:white;font-family:Inter,Arial;font-size:56px;font-weight:600;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">
                ${{ github.event.inputs.question }}
              </div>
            </foreignObject>
            <text x="540" y="1380" font-family="Inter, Arial" font-size="32" fill="#6b7280" text-anchor="middle">Live • 5 Hour Challenge</text>
          </svg>
          SVGEOF

      - name: Generate looped audio
        run: |
          # 5-minute ambient pad, will be looped
          ffmpeg -y -f lavfi -i "sine=frequency=220:beep_factor=4:duration=300,lowpass=f=800,volume=0.3" -f lavfi -i "anoisesrc=c=pink:r=44100:a=0.02:d=300" -filter_complex "[0:a][1:a]amix=inputs=2:duration=first" audio_loop.wav

      - name: Stream to YouTube (dynamic FFmpeg)
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          TOTAL=${{ steps.timing.outputs.total }}

          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -i trivia.svg \
            -stream_loop -1 -i audio_loop.wav \
            -filter_complex "\
              [0:v]scale=1080:1920,setsar=1,\
              hue=h='mod(t*8,360)':s=1.3,\
              eq=brightness='0.02*sin(t/4)':contrast=1.08:saturation=1.2,\
              zoompan=z='1+0.015*sin(t/12)':x='iw/2-(iw/zoom/2)+12*sin(t/3)':y='ih/2-(ih/zoom/2)+8*cos(t/2.7)':d=1:s=1080x1920:fps=30[bg];\
              [1:v]scale=960:-1[fg];\
              [bg][fg]overlay=(W-w)/2:(H-h)/2:format=auto,format=yuv420p[v]\
            " \
            -map "[v]" -map 2:a \
            -c:v libx264 -preset veryfast -b:v 2800k -maxrate 2800k -bufsize 5600k -g 60 -keyint_min 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -t $TOTAL \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_KEY}"
