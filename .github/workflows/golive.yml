name: golive

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Q Without U'
      question:
        description: 'Trivia question'
        required: true
        default: 'No English word starts with q without u. Prove me wrong.'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 1080
      HEIGHT: 1920

    steps:
      - name: Calculate duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds"

      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Get background
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg
          ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=30" bg_blur.jpg

      - name: Create SVG
        run: |
          cat > trivia.svg <<EOF
          <svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
              </linearGradient>
            </defs>
            <rect x="60" y="520" width="960" height="880" rx="48" fill="url(#g)" stroke="#ffffff22" stroke-width="2"/>
            <text x="540" y="640" font-family="Arial" font-size="52" font-weight="700" fill="#fbbf24" text-anchor="middle">TRIVIA</text>
            <text x="540" y="720" font-family="Arial" font-size="36" fill="#9ca3af" text-anchor="middle">${{ inputs.title }}</text>
            <foreignObject x="120" y="800" width="840" height="520">
              <div xmlns="http://www.w3.org/1999/xhtml" style="color:white;font-family:Arial;font-size:54px;font-weight:600;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;">
                ${{ inputs.question }}
              </div>
            </foreignObject>
          </svg>
          EOF

      - name: Make audio loop
        run: |
          ffmpeg -y -f lavfi -i "sine=f=220:d=300,volume=0.25" -f lavfi -i "anoisesrc=d=300:c=pink:r=44100:a=0.015" -filter_complex amix=2 -t 300 audio_loop.wav

      - name: Stream to YouTube
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -framerate 30 -i trivia.svg \
            -stream_loop -1 -i audio_loop.wav \
            -filter_complex "[0:v]scale=1080:1920,hue=h=t*8,eq=brightness=0.98:contrast=1.08,zoompan=z=1+0.01*sin(t/10):d=1:x=iw/2-(iw/zoom/2):y=ih/2-(ih/zoom/2):s=1080x1920:fps=30,format=yuv420p[bg];[1:v]scale=900:-1[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2[v];[2:a]aformat=channel_layouts=stereo,volume=0.8[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -g 60 -c:a aac -b:a 128k -ar 44100 -t $TOTAL -f flv "rtmp://a.rtmp.youtube.com/live2/zhz6-63as-rd13-wd4b-8kvy"
