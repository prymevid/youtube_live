name: golive

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Q Without U'
      question:
        description: 'Trivia question'
        required: true
        default: 'No English word starts with q without u. Prove me wrong.'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000 # 5 hours
      RANDOM_START_MAX: 600 # +0-10 min
      RANDOM_END_MAX: 600 # +0-10 min
      WIDTH: 1080
      HEIGHT: 1920

    steps:
      - name: Calculate duration
        id: timing
        run: |
          START=$(( RANDOM % RANDOM_START_MAX ))
          END=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START + END ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds (~$((TOTAL/3600))h $(((TOTAL%3600)/60))m)"

      - name: Install FFmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg librsvg2-bin

      - name: Get random background
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg
          ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=28" bg_blur.jpg

      - name: Create trivia SVG
        run: |
          cat > trivia.svg <<EOF
          <svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0b1220" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#111827" stop-opacity="0.92"/>
              </linearGradient>
            </defs>
            <rect x="70" y="540" width="940" height="840" rx="44" fill="url(#g)" stroke="#ffffff30" stroke-width="2"/>
            <text x="540" y="660" font-family="Arial,Helvetica" font-size="54" font-weight="bold" fill="#fbbf24" text-anchor="middle">TRIVIA CHALLENGE</text>
            <text x="540" y="730" font-family="Arial" font-size="34" fill="#9ca3af" text-anchor="middle">${{ inputs.title }}</text>
            <foreignObject x="130" y="820" width="820" height="480">
              <div xmlns="http://www.w3.org/1999/xhtml" style="color:#fff;font-family:Arial,Helvetica;font-size:52px;font-weight:600;line-height:1.35;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;padding:20px;">
                ${{ inputs.question }}
              </div>
            </foreignObject>
          </svg>
          EOF

      - name: Create audio loop
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=220:duration=300,volume=0.22" -f lavfi -i "anoisesrc=color=pink:duration=300:amplitude=0.012" -filter_complex "[0:a][1:a]amix=inputs=2:duration=longest" -ar 44100 -ac 1 audio_loop.wav

      - name: Stream to YouTube
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          echo "Starting 9:16 stream to YouTube..."

          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -framerate 30 -i trivia.svg \
            -stream_loop -1 -i audio_loop.wav \
            -filter_complex "\
              [0:v]scale=1080:1920,setsar=1,format=yuv420p,\
              hue=h='mod(6*t\,360)':s=1.25,\
              eq=brightness=0.02*sin(t/5)+0.98:contrast=1.07:saturation=1.15,\
              zoompan=z='1+0.008*sin(t/8)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30[bg]; \
              [1:v]format=rgba,scale=920:-1[fg]; \
              [bg][fg]overlay=(W-w)/2:(H-h)/2:shortest=1,format=yuv420p[v]; \
              [2:a]aformat=channel_layouts=stereo,volume=0.75,apad=pad_dur=$TOTAL[a] \
            " \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -tune stillimage -b:v 2600k -maxrate 2600k -bufsize 5200k -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -t $TOTAL \
            -f flv "rtmp://a.rtmp.youtube.com/live2/zhz6-63as-rd13-wd4b-8kvy"
