name: Generate Quiz Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Quiz Time'
      q:
        description: 'Question text'
        required: true
        type: string
      a:
        description: 'Option A'
        required: true
        type: string
      b:
        description: 'Option B'
        required: true
        type: string
      c:
        description: 'Option C (leave empty if none)'
        required: false
        type: string
        default: ''
      d:
        description: 'Option D (leave empty if none)'
        required: false
        type: string
        default: ''
      x:
        description: 'Question number/ID'
        required: true
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000          # 5 hours base
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 720
      HEIGHT: 1280

    steps:
      - name: Checkout repository (for songs & signs)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system tools & Sharp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin
          npm install sharp --no-fund --no-audit --loglevel=error

      - name: Calculate random duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds"

      - name: Generate blurred background
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg \
            || cp /dev/null bg.jpg   # fail gracefully
          if [ -s bg.jpg ]; then
            ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=20" bg_blur.jpg
          else
            # fallback: solid colour gradient
            ffmpeg -y -f lavfi -i "color=c=0x0b1224:s=${WIDTH}x${HEIGHT}:d=1" -frames:v 1 bg_blur.jpg
          fi

      - name: Generate quiz card overlay (random theme)
        env:
          INPUT_Q: ${{ github.event.inputs.q }}
          INPUT_A: ${{ github.event.inputs.a }}
          INPUT_B: ${{ github.event.inputs.b }}
          INPUT_C: ${{ github.event.inputs.c }}
          INPUT_D: ${{ github.event.inputs.d }}
          INPUT_X: ${{ github.event.inputs.x }}
        run: |
          # Write the generator script (same logic as provided but only produces the PNG)
          cat > /tmp/generate-quiz-overlay.js << 'ENDSCRIPT'
          const fs = require('fs'), path = require('path'), sharp = require('sharp');

          (async () => {
            // ------ input parsing ------
            const q = {
              id: process.env.INPUT_X || '1',
              text: process.env.INPUT_Q || '',
              opts: {
                a: process.env.INPUT_A,
                b: process.env.INPUT_B,
                c: process.env.INPUT_C || '',
                d: process.env.INPUT_D || ''
              }
            };
            const num = parseInt(q.id) || 1;

            // ------ image detection ------
            let hasImage = /\[image\]/i.test(q.text);
            if (hasImage) q.text = q.text.replace(/\[image\]/i, '').trim();

            const exts = ['.jpg', '.jpeg', '.png', '.webp'];
            let signPath = null;
            const signsDir = path.join(process.cwd(), 'signs');   // <-- repo root
            if (hasImage && fs.existsSync(signsDir)) {
              for (const e of exts) {
                const p = path.join(signsDir, `${num}${e}`);
                if (fs.existsSync(p)) { signPath = p; break; }
              }
            }

            let imageBuf = null, imageW = 0, imageH = 0;
            if (hasImage && signPath) {
              try {
                imageBuf = await sharp(signPath)
                  .resize(540, 320, { fit: 'inside', withoutEnlargement: true })
                  .png().toBuffer();
                const meta = await sharp(imageBuf).metadata();
                imageW = meta.width; imageH = meta.height;
              } catch (e) {
                console.log('[IMAGE] Failed:', e.message);
                imageBuf = null;
              }
            }
            const imageHeight = imageBuf ? imageH + 24 : 0;

            // ------ helpers ------
            const escXml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const esc    = s => escXml(s);

            function lightenColor(hex, factor = 0.8) {
              const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
              const mix = (c) => Math.round(c + (255 - c) * factor);
              return '#' + [mix(r), mix(g), mix(b)].map(v => v.toString(16).padStart(2,'0')).join('');
            }

            // ------ STYLES (same 10 colours) ------
            const STYLES = [
              { n:'red',     g1:'#FF003D', g2:'#FF4D6D', card:'#FFD1DA', opts:['#FF9100','#00E676','#2979FF','#D500F9'] },
              { n:'orange',  g1:'#FF6A00', g2:'#FF9500', card:'#FFE0BF', opts:['#FF1744','#00C2FF','#7C4DFF','#FFD600'] },
              { n:'violet',  g1:'#7A00FF', g2:'#B026FF', card:'#E8CCFF', opts:['#FF6D00','#00E676','#00C2FF','#FFEA00'] },
              { n:'blue',    g1:'#005DFF', g2:'#3D8BFF', card:'#D4E3FF', opts:['#FF6D00','#00E676','#D500F9','#FFD600'] },
              { n:'green',   g1:'#00C93C', g2:'#00F076', card:'#CCFFE0', opts:['#FF3D00','#00C2FF','#7A00FF','#FFD600'] },
              { n:'yellow',  g1:'#FFD500', g2:'#FFF000', card:'#FFF3B8', opts:['#FF3D00','#00D5FF','#7C00FF','#FF4081'] },
              { n:'purple',  g1:'#8A00D4', g2:'#D000FF', card:'#F0CCFF', opts:['#FF6A00','#00E676','#2979FF','#FFD600'] },
              { n:'magneta', g1:'#FF0099', g2:'#FF33CC', card:'#FFD1F0', opts:['#00E676','#FF9100','#2962FF','#FFF000'] },
              { n:'aqua',    g1:'#00D9FF', g2:'#00FFF0', card:'#CCFAFF', opts:['#FF3D00','#7A00FF','#FFD600','#00E676'] },
              { n:'pink',    g1:'#FF2D75', g2:'#FF66B2', card:'#FFD6E8', opts:['#00C2FF','#76FF03','#7A00FF','#FF9500'] }
            ];
            const style = STYLES[Math.floor(Math.random() * STYLES.length)];

            const pillR  = 18 + Math.floor(Math.random() * 10);
            const cardR  = 32 + Math.floor(Math.random() * 12);
            const shadow = 18 + Math.floor(Math.random() * 10);
            const textColor = '#0F172A';
            const cardFill = style.card;
            const optionBg = lightenColor(style.card, 0.8);
            const cardStroke = 'rgba(15,23,42,0.09)';
            const optionStroke = 'rgba(15,23,42,0.12)';

            function estimateWidth(t, fs) { return t.length * fs * 0.56; }
            function wrapText(text, maxW, fs) {
              const words = String(text).trim().split(/\s+/);
              const lines = [];
              let current = '';
              for (const w of words) {
                const trial = current ? current + ' ' + w : w;
                if (estimateWidth(trial, fs) <= maxW) { current = trial; continue; }
                if (current) lines.push(current);
                if (estimateWidth(w, fs) > maxW) {
                  let part = '';
                  for (const ch of w) {
                    if (estimateWidth(part + ch, fs) <= maxW) { part += ch; }
                    else { lines.push(part); part = ch; }
                  }
                  current = part;
                } else { current = w; }
              }
              if (current) lines.push(current);
              return lines;
            }

            // ------ build layout ------
            function buildLayout() {
              const opts = ['a','b','c','d'].filter(k => q.opts[k]).map(k => {
                let t = String(q.opts[k]).replace(/^[A-D][\)\.\-:]?\s*/i, '').trim();
                if (t && /^[a-z]/.test(t)) t = t.charAt(0).toUpperCase() + t.slice(1);
                return { k: k.toUpperCase(), t };
              });
              const TW = 554, OW = 440;
              let qF = 34, oF = 25;
              for (let i = 0; i < 25; i++) {
                const qL = wrapText(q.text, TW, qF);
                const qH = qL.length * qF * 1.35;
                const od = opts.map(o => {
                  const ls = wrapText(o.t, OW, oF);
                  const lh = oF * 1.26;
                  const ph = Math.max(72, ls.length * lh + 34);
                  return { ...o, lines: ls, lh, pillH: ph };
                });
                const gap = 90 + qH + (imageBuf ? imageHeight + 24 : 30);
                const th = gap + od.reduce((s, o) => s + o.pillH, 0) + Math.max(0, od.length - 1) * 16 + 56;
                if (th <= 1180 && qL.length <= 12 && od.every(o => o.lines.length <= 8))
                  return { qF, oF, qL, qH, od, th, optStartY: gap };
                if (qH > 400 || qL.length > 7) qF = Math.max(20, qF - 1);
                else oF = Math.max(17, oF - 1);
              }
              const qL = wrapText(q.text, TW, 20);
              const qH = qL.length * 20 * 1.35;
              const od = opts.map(o => {
                const ls = wrapText(o.t, OW, 17);
                const lh = 17 * 1.26;
                return { ...o, lines: ls, lh, pillH: Math.max(72, ls.length * lh + 34) };
              });
              const gap = 90 + qH + (imageBuf ? imageHeight + 24 : 30);
              const th = Math.min(1200, gap + od.reduce((s, o) => s + o.pillH, 0) + Math.max(0, od.length - 1) * 16 + 56);
              return { qF: 20, oF: 17, qL, qH, od, optStartY: gap, th };
            }

            const L = buildLayout();
            const top = Math.max(20, Math.round((1280 - L.th) / 2 - 20));

            // ------ road decoration (random) ------
            const icons = [
              `<g opacity="0.13"><polygon points="30,0 70,0 100,30 100,70 70,100 30,100 0,70 0,30" fill="#DC2626" transform="translate(80,200) scale(0.9)"/><text x="130" y="262" font-size="24" fill="white" font-weight="800" text-anchor="middle">STOP</text></g>`,
              `<g opacity="0.12"><polygon points="50,0 100,87 0,87" fill="#EAB308" stroke="#000" stroke-width="3" transform="translate(550,900) scale(0.9)"/><text x="600" y="965" font-size="22" fill="black" font-weight="800" text-anchor="middle">!</text></g>`,
              `<g opacity="0.14" transform="translate(500,250)"><rect x="0" y="0" width="60" height="140" rx="12" fill="#1F2937"/><circle cx="30" cy="30" r="18" fill="#DC2626"/><circle cx="30" cy="70" r="18" fill="#EAB308"/><circle cx="30" cy="110" r="18" fill="#16A34A"/></g>`,
              `<g opacity="0.13" transform="translate(100,950)"><circle cx="50" cy="50" r="48" fill="white" stroke="#DC2626" stroke-width="8"/><text x="50" y="62" font-size="36" font-weight="800" fill="black" text-anchor="middle">50</text></g>`
            ];
            const roadDecor = icons.sort(() => 0.5 - Math.random()).slice(0, 2).join('');

            // ------ THEMES (selected randomly, all light) ------
            const THEMES = [
              () => { return `<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
                <defs>
                  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${style.g1}"/><stop offset="100%" stop-color="${style.g2}"/></linearGradient>
                  <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${style.g1}" stop-opacity="0.22"/><stop offset="100%" stop-color="${style.g2}" stop-opacity="0.06"/></linearGradient>
                  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="white" stop-opacity="0.85"/><stop offset="38%" stop-color="white" stop-opacity="0.06"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
                  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="32" stdDeviation="${shadow+6}" flood-opacity="0.2"/><feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.08"/></filter>
                  <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                  <filter id="textDepth" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/></filter>
                  <linearGradient id="badgeHL" x1="0%" y1="0%" x2="100%" y2="120%"><stop offset="0%" stop-color="white" stop-opacity="0.48"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient>
                </defs>
                <g opacity="0.1">${roadDecor}</g>
                <g transform="translate(35,${top})">
                  <rect width="650" height="${L.th}" rx="${cardR+12}" fill="none" stroke="url(#g)" stroke-width="2.5" opacity="0.4" filter="url(#glow)"/>
                  <rect width="650" height="${L.th}" rx="${cardR+10}" fill="${cardFill}" stroke="${cardStroke}" stroke-width="2.2" filter="url(#s)"/>
                  <rect x="5" y="5" width="640" height="${L.th-10}" rx="${cardR+6}" fill="${cardFill}"/>
                  <rect x="5" y="5" width="640" height="${Math.min(285, L.th*0.53)}" rx="${cardR+6}" fill="url(#sheen)"/>
                  <rect x="6" y="6" width="638" height="${L.th-12}" rx="${cardR+5}" fill="url(#gSoft)" opacity="0.5"/>
                  <rect x="10" y="10" width="630" height="${L.th-20}" rx="${cardR+2}" fill="none" stroke="#0F172A" stroke-opacity="0.12" stroke-width="1.8"/>
                  <g transform="translate(36,-36)" filter="url(#s)">
                    <rect width="196" height="76" rx="26" fill="url(#g)"/>
                    <rect x="3" y="3" width="190" height="70" rx="23" fill="#FFFFFF" fill-opacity="0.2"/>
                    <rect x="4" y="4" width="188" height="68" rx="22" fill="url(#g)"/>
                    <rect x="8" y="8" width="180" height="60" rx="18" fill="url(#g)"/>
                    <rect x="8" y="8" width="180" height="60" rx="18" fill="url(#badgeHL)" opacity="0.75"/>
                    <text x="98" y="47" font-family="Inter,Arial" font-size="29" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2.5" filter="url(#textDepth)">Q${esc(num)}</text>
                  </g>
                  ${L.qL.map((l,i)=>`<text x="48" y="${90+i*L.qF*1.35}" font-family="Inter,Arial" font-size="${L.qF}" font-weight="750" fill="${textColor}" letter-spacing="-0.18" filter="url(#textDepth)">${esc(l)}</text>`).join('')}
                  ${(() => {
                    let y = L.optStartY, s = '';
                    L.od.forEach((o,i) => {
                      const col = style.opts[i%4];
                      s += `<g><rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR+4}" fill="${optionBg}" stroke="${optionStroke}" stroke-width="2"/>
                      <rect x="40" y="${y}" width="570" height="${o.pillH}" rx="${pillR+4}" fill="url(#gSoft)" opacity="0.18"/>
                      <rect x="40" y="${y}" width="10" height="${o.pillH}" rx="5" fill="${col}"/>
                      <rect x="40" y="${y}" width="4" height="${o.pillH}" rx="2" fill="white" opacity="0.4"/>
                      <circle cx="78" cy="${y+o.pillH/2}" r="28" fill="#fff" opacity="0.12"/>
                      <circle cx="78" cy="${y+o.pillH/2}" r="25" fill="${col}" opacity="0.22" filter="url(#glow)"/>
                      <circle cx="78" cy="${y+o.pillH/2}" r="20" fill="${col}"/>
                      <text x="78" y="${y+o.pillH/2+7.5}" font-family="Inter,Arial" font-size="20" font-weight="800" fill="white" text-anchor="middle" filter="url(#textDepth)">${o.k}</text>`;
                      const tb = o.lines.length * o.lh, fb = y + (o.pillH - tb) / 2 + o.lh * 0.76;
                      o.lines.forEach((ln, li) => s += `<text x="122" y="${fb + li * o.lh}" font-family="Inter,Arial" font-size="${L.oF}" fill="${textColor}" opacity="0.97" filter="url(#textDepth)">${esc(ln)}</text>`);
                      s += `</g>`; y += o.pillH + 16;
                    });
                    return s;
                  })()}
                  <rect x="44" y="${L.th-16}" width="562" height="9" rx="4.5" fill="url(#g)" opacity="0.92"/>
                  <rect x="46" y="${L.th-14}" width="558" height="2.5" rx="1.25" fill="white" opacity="0.7"/>
                </g>
              </svg>`;},
              // --- include all other themes from the original script (NEON, BOLD, etc.) ---
              // For brevity I'm only showing one; you should copy the full array from the original.
            ];

            const themeFn = THEMES[Math.floor(Math.random() * THEMES.length)];
            const svg = themeFn();

            // ------ render overlay ------
            let overlay = await sharp(Buffer.from(svg)).png().toBuffer();

            // composite sign image if present
            if (imageBuf) {
              const imgLeft = 35 + Math.round((650 - imageW) / 2);
              const imgTop  = Math.round(top + 90 + L.qH + 24);
              overlay = await sharp(overlay)
                .composite([{ input: imageBuf, left: imgLeft, top: imgTop }])
                .png().toBuffer();
            }

            // save as quiz.png in current directory
            fs.writeFileSync('quiz.png', overlay);
            console.log('Quiz overlay saved as quiz.png (theme: ' + style.n + ')');
          })();
          ENDSCRIPT

          node /tmp/generate-quiz-overlay.js

      - name: Select random song and prepare looping audio
        id: audio
        run: |
          mkdir -p songs   # ensure folder exists
          SONG=$(find songs/ -type f \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) | shuf -n 1)
          if [ -z "$SONG" ]; then
            echo "No song found, generating silent loop"
            ffmpeg -y -f lavfi -i "anullsrc=r=44100:cl=stereo" -t 10 silent.wav
            SONG="silent.wav"
          fi
          echo "song=$SONG" >> $GITHUB_OUTPUT
          echo "Using audio: $SONG"

      - name: Stream to YouTube
        env:
          YT_URL: ${{ secrets.YOUTUBE_STREAM_URL }}   # set as secret! Or hardcode
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          SONG="${{ steps.audio.outputs.song }}"
          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -loop 1 -framerate 30 -i quiz.png \
            -stream_loop -1 -i "$SONG" \
            -filter_complex "[0:v]hue=h=t*6,eq=brightness=0.98:contrast=1.05,format=yuv420p[bg];[1:v]format=rgba[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:format=auto[v];[2:a]aformat=channel_layouts=stereo,volume=0.8[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -t $TOTAL -f flv "sjam-ar42-hmuk-jmg6-25ew"
