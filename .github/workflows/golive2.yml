name: golive2

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Stream title'
        required: true
        default: 'Q Without U'
      question:
        description: 'Trivia question'
        required: true
        default: 'No English word starts with q without u. Prove me wrong.'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASE_DURATION_SEC: 18000
      RANDOM_START_MAX: 600
      RANDOM_END_MAX: 600
      WIDTH: 720
      HEIGHT: 1280

    steps:
      - name: Calculate duration
        id: timing
        run: |
          START_OFFSET=$(( RANDOM % RANDOM_START_MAX ))
          END_OFFSET=$(( RANDOM % RANDOM_END_MAX ))
          TOTAL=$(( BASE_DURATION_SEC + START_OFFSET + END_OFFSET ))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Streaming for $TOTAL seconds"

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ffmpeg librsvg2-bin
          version: 1.0

      - name: Install FFmpeg + SVG tools (fast)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin

      - name: Get background
        run: |
          curl -L "https://picsum.photos/${WIDTH}/${HEIGHT}?random=$(date +%s%N)" -o bg.jpg
          ffmpeg -y -i bg.jpg -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},gblur=sigma=20" bg_blur.jpg

      - name: Create overlay (720x1280) - ULTRA PREMIUM
        run: |
          TITLE="${{ inputs.title }}"
          QUESTION="${{ inputs.question }}"

          # Escape XML properly
          TITLE_ESC=$(printf '%s' "$TITLE" | sed "s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\"/\&quot;/g; s/'/\&#39;/g")
          QUESTION_ESC=$(printf '%s' "$QUESTION" | sed "s/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/\"/\&quot;/g; s/'/\&#39;/g")

          # Wrap at 28 chars for premium readability
          WRAPPED=$(echo "$QUESTION_ESC" | fold -s -w 28)
          TSPAN=""
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [ $i -eq 0 ]; then
              TSPAN="${TSPAN}<tspan x=\"360\" dy=\"0\">${line}</tspan>"
            else
              TSPAN="${TSPAN}<tspan x=\"360\" dy=\"1.55em\">${line}</tspan>"
            fi
            i=$((i+1))
          done <<< "$WRAPPED"

          cat > trivia.svg <<EOF
          <svg width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#020617"/>
                <stop offset="50%" stop-color="#0b1224"/>
                <stop offset="100%" stop-color="#050814"/>
              </linearGradient>
              <radialGradient id="halo" cx="50%" cy="12%" r="65%">
                <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38"/>
                <stop offset="30%" stop-color="#a855f7" stop-opacity="0.18"/>
                <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fef3c7"/>
                <stop offset="45%" stop-color="#fbbf24"/>
                <stop offset="55%" stop-color="#f59e0b"/>
                <stop offset="100%" stop-color="#d97706"/>
              </linearGradient>
              <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1e293b" stop-opacity="0.94"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
              </linearGradient>
              <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#fde68a" stop-opacity="0.95"/>
              </linearGradient>
              <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
                <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
              </linearGradient>
              <filter id="cardShadow" x="-30%" y="-20%" width="160%" height="160%">
                <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.65"/>
              </filter>
              <filter id="outerGlow">
                <feGaussianBlur stdDeviation="18" result="blur"/>
                <feFlood flood-color="#fbbf24" flood-opacity="0.25" result="color"/>
                <feComposite in="color" in2="blur" operator="in" result="glow"/>
                <feComposite in="SourceGraphic" in2="glow" operator="over"/>
              </filter>
              <filter id="noise">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
                <feColorMatrix type="saturate" values="0"/>
                <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
              </filter>
              <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
                <circle cx="1" cy="1" r="1.1" fill="#ffffff" fill-opacity="0.045"/>
              </pattern>
              <clipPath id="cardClip">
                <rect x="44" y="274" width="632" height="732" rx="52"/>
              </clipPath>
            </defs>

            <!-- background -->
            <rect width="720" height="1280" fill="url(#bg)"/>
            <rect width="720" height="1280" fill="url(#halo)"/>
            <rect width="720" height="1280" fill="url(#dots)"/>

            <!-- soft outer glow behind card -->
            <rect x="28" y="250" width="664" height="772" rx="64" fill="#fbbf24" fill-opacity="0.12" filter="url(#outerGlow)"/>

            <!-- main card -->
            <rect x="44" y="274" width="632" height="732" rx="52" fill="url(#cardFill)" filter="url(#cardShadow)"/>
            <rect x="44" y="274" width="632" height="732" rx="52" fill="none" stroke="url(#border)" stroke-width="3.5"/>
            <rect x="46.5" y="276.5" width="627" height="727" rx="49.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
            <g clip-path="url(#cardClip)" opacity="0.6">
              <rect x="44" y="274" width="632" height="732" fill="#ffffff" filter="url(#noise)"/>
            </g>

            <!-- header plate -->
            <rect x="44" y="274" width="632" height="148" rx="52" fill="#0b1325" fill-opacity="0.55"/>
            <rect x="120" y="418" width="480" height="2.5" fill="url(#divider)"/>

            <!-- TRIVIA title -->
            <text x="360" y="372" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="5" style="paint-order:stroke; stroke:#000; stroke-opacity:0.35; stroke-width:3px;">TRIVIA</text>

            <!-- stream title -->
            <g opacity="0.9">
              <text x="360" y="458" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5">${TITLE_ESC}</text>
            </g>

            <!-- decorative quote -->
            <text x="108" y="585" font-family="Georgia,serif" font-size="140" fill="#ffffff" opacity="0.055">“</text>

            <!-- QUESTION - multi-line -->
            <text x="360" y="545" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle" style="paint-order:stroke; stroke:#000000; stroke-opacity:0.28; stroke-width:2.5px;">${TSPAN}</text>

            <!-- LIVE pill -->
            <g transform="translate(360,970)">
              <circle cx="0" cy="0" r="32" fill="#ef4444" fill-opacity="0.18"/>
              <circle cx="0" cy="0" r="24" fill="#ef4444"/>
              <circle cx="0" cy="0" r="24" fill="none" stroke="#fca5a5" stroke-opacity="0.5" stroke-width="6"/>
              <text x="0" y="5" font-family="'Inter',Arial,sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1">LIVE</text>
            </g>

            <text x="360" y="1035" font-family="'Inter',Arial,sans-serif" font-size="22" fill="#94a3af" text-anchor="middle" opacity="0.85">Answer in chat • First correct wins</text>

            <!-- corner sparkles -->
            <g fill="#fbbf24" opacity="0.85">
              <circle cx="84" cy="312" r="3.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
              <circle cx="636" cy="312" r="3.2"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>
              <circle cx="84" cy="968" r="2.6" opacity="0.6"/>
              <circle cx="636" cy="968" r="2.6" opacity="0.6"/>
            </g>

            <!-- subtle vignette -->
            <rect width="720" height="1280" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="80" rx="120" style="pointer-events:none"/>
          </svg>
          EOF

          rsvg-convert -w 720 -h 1280 trivia.svg -o trivia.png

      - name: Make audio loop
        run: |
          ffmpeg -y -f lavfi -i "sine=f=220:d=300,volume=0.25" -f lavfi -i "anoisesrc=d=300:c=pink:r=44100:a=0.015" -filter_complex amix=inputs=2:duration=longest -t 300 audio_loop.wav

      - name: Stream to YouTube
        run: |
          TOTAL=${{ steps.timing.outputs.total }}
          ffmpeg -hide_banner -loglevel info \
            -loop 1 -framerate 30 -i bg_blur.jpg \
            -loop 1 -framerate 30 -i trivia.png \
            -stream_loop -1 -i audio_loop.wav \
            -filter_complex "[0:v]hue=h=t*6,eq=brightness=0.98:contrast=1.05,format=yuv420p[bg];[1:v]format=rgba[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:format=auto[v];[2:a]aformat=channel_layouts=stereo,volume=0.8[a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -t $TOTAL -f flv "rtmp://a.rtmp.youtube.com/live2/sjam-ar42-hmuk-jmg6-25ew"
